server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;

    # Hash-based navigation does not require a catch-all document fallback.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html { internal; }

    location = /robots.txt { proxy_pass http://backend:8080/robots.txt; }
    location = /sitemap.xml { proxy_pass http://backend:8080/sitemap.xml; }

    # Proxy API calls → backend (avoids CORS in production)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
