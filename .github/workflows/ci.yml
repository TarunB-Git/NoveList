name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python lint
        run: ruff check --output-format github backend scripts tests
      - name: JavaScript syntax
        run: node --check frontend/app.js

  checks:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/requirements-scraper.txt
            requirements-dev.txt
      - name: Install CPU inference runtime
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: make install-dev
      - name: Install optional provisioning SDK for offline checks
        if: ${{ hashFiles('scripts/requirements-cloud.txt') != '' }}
        run: python -m pip install -r scripts/requirements-cloud.txt
      - name: Test
        run: make test

  search-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - name: Initialize report
        run: |
          printf '%s\n' '{"status":"failed","errors":["Benchmark did not start; inspect earlier job steps."]}' \
            > "$RUNNER_TEMP/search-quality.json"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
          key: minilm-l6-v2-${{ runner.os }}-v1
      - name: Install CPU search dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt
      - name: Build fictional fixture index
        run: |
          python scripts/build_index.py \
            --data tests/search_quality_catalogue.json \
            --index-dir "$RUNNER_TEMP/search-fixture-index"
      - name: Enforce search quality
        run: |
          python scripts/benchmark_search.py \
            --index-dir "$RUNNER_TEMP/search-fixture-index" \
            --queries tests/search_quality_queries.json \
            --mode hybrid-typo --min-hit-at-5 0.90 --min-single-typo-hit-at-5 0.90 \
            | tee "$RUNNER_TEMP/search-quality.json"
        shell: bash
      - name: Upload search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/search-quality.json
          if-no-files-found: error

  deploy-dry-run:
    needs: search-quality
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Search quality passed; a dependent job can start.'

  deploy:
    needs: [lint, checks, search-quality]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy-azure.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
