name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python lint
        run: ruff check --output-format github backend scripts tests
      - name: JavaScript syntax
        run: node --check frontend/app.js

  checks:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/requirements-scraper.txt
            requirements-dev.txt
      - name: Install CPU inference runtime
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: make install-dev
      - name: Install optional provisioning SDK for offline checks
        if: ${{ hashFiles('scripts/requirements-cloud.txt') != '' }}
        run: python -m pip install -r scripts/requirements-cloud.txt
      - name: Test
        run: make test

  deploy:
    needs: [lint, checks]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy-azure.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
