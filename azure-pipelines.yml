
trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-24.04

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'

  - script: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
    displayName: Install CPU inference runtime

  - script: make install-dev
    displayName: Install dependencies

  - script: make lint
    displayName: Run lint checks

  - script: make test
    displayName: Run tests
